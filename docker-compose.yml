services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zevo}
      POSTGRES_USER: ${POSTGRES_USER:-zevo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zevo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-zevo}:${POSTGRES_PASSWORD:-zevo}@postgres:5432/${POSTGRES_DB:-zevo}
      DEV_MODE: ${DEV_MODE:-true}
      SIMULATION_TICK_SECONDS: ${SIMULATION_TICK_SECONDS:-5}
      GENERATIONS_PER_TICK: ${GENERATIONS_PER_TICK:-1000}
      SIMULATION_RANDOM_SEED: ${SIMULATION_RANDOM_SEED:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports: ["8000:8000"]
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports: ["5173:5173"]
volumes:
  postgres_data:
